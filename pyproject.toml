[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "herald"
version = "0.1.0"
description = "Site-scale semantic navigation framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "shapely>=2.0",
    "pyproj>=3.6",
    "numpy>=1.26",
    "pydantic>=2.0",
    "pillow>=10.0",
    "tqdm>=4.66",
    "scikit-learn>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
vlm = [
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
]
viz = [
    "folium>=0.18",
]
viewer = [
    "rerun-sdk>=0.20",
]
# Phase-2 refinement: VGGT-Omega geometry brain + imaging deps. Heavy and CUDA-bound,
# kept OUT of default-groups — install explicitly: uv sync --group recon
# VGGT-Omega ships from GitHub (no PyPI); imported as `vggt_omega` in herald.scene.recon.vggt.
# open3d omitted (no cp313 wheel; fusion is NumPy-only).
recon = [
    "torch>=2.1",
    "torchvision>=0.16",
    "huggingface-hub>=0.20",
    "safetensors>=0.4",
    "einops>=0.7",
    "opencv-python>=4.8",
    "imageio>=2.31",
    "vggt-omega @ git+https://github.com/facebookresearch/vggt-omega.git",
]
# SAM2 video segmentation via HF Transformers (Sam2VideoModel needs >=4.56).
# Heavy, kept OUT of default-groups — install explicitly: uv sync --group seg
seg = [
    "torch>=2.1",
    "torchvision>=0.16",  # Sam2ImageProcessor (the video processor's backbone) requires it
    "transformers>=4.56",
    "sentencepiece>=0.2",  # SigLIP / SigLIP2 text tokenizer
]
# Open-vocab object detection (YOLO-World via ultralytics). Heavy/CUDA, kept OUT
# of default-groups — install explicitly: uv sync --group det
det = [
    "ultralytics>=8.3",
    "clip @ git+https://github.com/ultralytics/CLIP.git",  # YOLO-World text encoder (set_classes)
    "ftfy>=6.0",
]

[tool.uv]
default-groups = ["dev", "viz", "vlm"]

[tool.setuptools.packages.find]
where = ["."]
include = ["herald*", "services*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
